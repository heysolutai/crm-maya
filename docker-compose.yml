services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      # These should be set in .env or via your deployment platform:
      # - NEXT_PUBLIC_SUPABASE_URL=
      # - NEXT_PUBLIC_SUPABASE_ANON_KEY=
      # - SUPABASE_SERVICE_ROLE_KEY=
      # - N8N_AI_WEBHOOK_URL=
      # - NEXT_PUBLIC_APP_URL=
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
